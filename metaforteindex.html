<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Meta Forte" />
<meta name="theme-color" content="#14121f" />
<title>Meta Forte</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF5E3A'/%3E%3Cstop offset='1' stop-color='%23FF2D55'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='%2314121f'/%3E%3Ctext x='90' y='120' font-size='90' text-anchor='middle' font-family='sans-serif'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0d0b14; overscroll-behavior: none; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .fade { animation: f .35s ease; }
  @keyframes f { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  input::placeholder { color: #8a8a9a; }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------- Plano fixo (montado na consulta) ----------
const FRASES = [
  { t: "O corpo alcança o que a mente acredita. Hoje é dia de provar.", f: "" },
  { t: "Tudo posso naquele que me fortalece.", f: "Filipenses 4:13" },
  { t: "Disciplina é escolher entre o que você quer agora e o que você quer mais.", f: "" },
  { t: "O Senhor é a minha força e o meu escudo; nele confia o meu coração.", f: "Salmos 28:7" },
  { t: "Não é sobre ser o melhor. É sobre ser melhor do que ontem.", f: "" },
  { t: "Corram de tal maneira que alcancem o prêmio.", f: "1 Coríntios 9:24" },
  { t: "O suor de hoje é o sorriso de amanhã.", f: "" },
  { t: "Esforcem-se e tenham bom ânimo; não temam.", f: "Deuteronômio 31:6" },
  { t: "Cada marmita pesada é um voto na pessoa que você quer se tornar.", f: "" },
  { t: "Aqueles que esperam no Senhor renovam as suas forças.", f: "Isaías 40:31" },
  { t: "A dor que você sente hoje será a força que você sentirá amanhã.", f: "" },
  { t: "Tudo o que fizerem, façam de todo o coração, como para o Senhor.", f: "Colossenses 3:23" },
  { t: "Constância vence intensidade. Aparecer todo dia é o segredo.", f: "" },
  { t: "Combati o bom combate, terminei a corrida, guardei a fé.", f: "2 Timóteo 4:7" },
];

const TREINOS = {
  1: { nome: "Peito · Ombro · Tríceps", tipo: "força", ex: [
    { n: "Supino reto (máquina ou barra)", s: 3, r: "10-12" },
    { n: "Supino inclinado com halteres", s: 3, r: "10-12" },
    { n: "Crucifixo na máquina (peck deck)", s: 3, r: "12-15" },
    { n: "Desenvolvimento de ombro (máquina)", s: 3, r: "10-12" },
    { n: "Elevação lateral com halteres", s: 3, r: "12-15" },
    { n: "Tríceps na polia (corda/barra)", s: 3, r: "12-15" },
  ]},
  2: { nome: "Cardio", tipo: "cardio", ex: [
    { n: "Esteira/rua: 3 min caminhada rápida + 1 min corrida leve", s: 1, r: "30-40 min" },
    { n: "Alternativa: bike", s: 1, r: "35-40 min" },
  ]},
  3: { nome: "Costas · Bíceps", tipo: "força", ex: [
    { n: "Puxada frontal na polia (pulldown)", s: 3, r: "10-12" },
    { n: "Remada sentada na máquina", s: 3, r: "10-12" },
    { n: "Remada curvada com halteres", s: 3, r: "10-12" },
    { n: "Rosca direta com barra", s: 3, r: "10-12" },
    { n: "Rosca alternada com halteres", s: 3, r: "12" },
    { n: "Prancha", s: 3, r: "30-40s" },
    { n: "Elevação de pernas", s: 3, r: "15" },
  ]},
  4: { nome: "Cardio", tipo: "cardio", ex: [
    { n: "Esteira/rua ou bike (varie para não enjoar)", s: 1, r: "35-40 min" },
  ]},
  5: { nome: "Pernas (completo)", tipo: "força", ex: [
    { n: "Leg press", s: 3, r: "12-15" },
    { n: "Cadeira extensora", s: 3, r: "12-15" },
    { n: "Cadeira flexora", s: 3, r: "12-15" },
    { n: "Agachamento (Smith, carga leve, técnica)", s: 3, r: "10-12" },
    { n: "Panturrilha na máquina", s: 4, r: "15-20" },
  ]},
  6: { nome: "Cardio leve (opcional)", tipo: "cardio", ex: [
    { n: "Caminhada tranquila", s: 1, r: "40-50 min" },
  ]},
  0: { nome: "Descanso", tipo: "descanso", ex: [] },
};

const REFEICOES = [
  { id: "cafe", nome: "Café da manhã", kcal: 350, itens: ["3 ovos mexidos + 2 claras", "1 fatia de pão integral", "Café preto (adoçante se quiser)"] },
  { id: "almoco", nome: "Almoço (marmita)", kcal: 500, itens: ["140g frango grelhado (pronto)", "100g arroz branco cozido", "80g feijão cozido (escorrido)", "Salada/legumes à vontade + 5g azeite"] },
  { id: "lanche", nome: "Lanche da tarde", kcal: 300, itens: ["120g frango desfiado OU 1 lata de sardinha", "1 fruta"] },
  { id: "jantar", nome: "Jantar (marmita)", kcal: 450, itens: ["150g peixe OU 130g patinho moído (pronto)", "150g batata/mandioca/abóbora cozida", "Legumes à vontade + 5g azeite"] },
  { id: "ceia", nome: "Ceia (opcional)", kcal: 100, itens: ["Iogurte natural OU 2 ovos cozidos OU 1 scoop de whey"] },
];

const MACROS = { kcal: 1700, prot: 180, carb: 130, gord: 50 };
const META_TREINOS_SEMANA = 5;

const hoje = () => new Date().toISOString().slice(0, 10);
const diaSemana = () => new Date().getDay();

function useStore(key, inicial) {
  const [val, setVal] = useState(() => {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : inicial; }
    catch { return inicial; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }, [key, val]);
  return [val, setVal];
}

function FitApp() {
  const [aba, setAba] = useState("hoje");
  const [log, setLog] = useStore("mf_log", {});
  const [pesos, setPesos] = useStore("mf_pesos", []);
  const nome = "Renan";
  const d = hoje();
  const dia = log[d] || { refeicoes: {}, exercicios: {}, treinoFeito: false };
  const setDia = (novo) => setLog({ ...log, [d]: { ...dia, ...novo } });

  const streak = useMemo(() => {
    let s = 0; const dt = new Date();
    for (let i = 0; i < 400; i++) {
      const key = dt.toISOString().slice(0, 10); const reg = log[key];
      const feito = reg && (reg.treinoFeito || Object.values(reg.refeicoes || {}).filter(Boolean).length >= 3);
      if (feito) s++; else if (i !== 0) break;
      dt.setDate(dt.getDate() - 1);
    }
    return s;
  }, [log]);

  const treinosSemana = useMemo(() => {
    const dt = new Date(); const inicio = new Date(dt);
    inicio.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
    let c = 0;
    Object.entries(log).forEach(([k, v]) => {
      const data = new Date(k + "T00:00:00");
      if (data >= inicio && v.treinoFeito) c++;
    });
    return c;
  }, [log]);

  const fraseHoje = FRASES[new Date().getDate() % FRASES.length];

  return (
    <div style={S.app}>
      <header style={S.header}>
        <div>
          <div style={S.logo}>META<span style={{color:"#FFE14D"}}>FORTE</span></div>
          <div style={S.sub}>E aí, {nome}. Bora pra cima. 🔥</div>
        </div>
        <div style={S.streakBadge}>
          <div style={S.streakNum}>{streak}</div>
          <div style={S.streakLbl}>dias<br/>seguidos</div>
        </div>
      </header>
      <main style={S.main}>
        {aba === "hoje" && <Hoje frase={fraseHoje} streak={streak} treinosSemana={treinosSemana} treino={TREINOS[diaSemana()]} dia={dia} irTreino={()=>setAba("treino")} irDieta={()=>setAba("dieta")} />}
        {aba === "treino" && <Treino treino={TREINOS[diaSemana()]} dia={dia} setDia={setDia} />}
        {aba === "dieta" && <Dieta dia={dia} setDia={setDia} />}
        {aba === "progresso" && <Progresso pesos={pesos} setPesos={setPesos} />}
      </main>
      <nav style={S.nav}>
        {[["hoje","Hoje","🔥"],["treino","Treino","💪"],["dieta","Dieta","🍱"],["progresso","Progresso","📈"]].map(([id,lbl,ic])=>(
          <button key={id} onClick={()=>setAba(id)} style={{...S.navBtn,...(aba===id?S.navBtnOn:{})}}>
            <span style={{fontSize:22}}>{ic}</span>
            <span style={{fontSize:11,fontWeight:700}}>{lbl}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

function Hoje({ frase, streak, treinosSemana, treino, dia, irTreino, irDieta }) {
  const refFeitas = Object.values(dia.refeicoes || {}).filter(Boolean).length;
  const pct = Math.min(100, Math.round((treinosSemana / META_TREINOS_SEMANA) * 100));
  return (
    <div className="fade">
      <div style={S.fraseCard}>
        <div style={S.fraseAspas}>"</div>
        <div style={S.fraseTxt}>{frase.t}</div>
        {frase.f && <div style={S.fraseFonte}>— {frase.f}</div>}
      </div>
      <div style={S.metaCard}>
        <div style={S.metaTop}>
          <span style={S.metaLbl}>Meta da semana</span>
          <span style={S.metaVal}>{treinosSemana}/{META_TREINOS_SEMANA} treinos</span>
        </div>
        <div style={S.barBg}><div style={{...S.barFill, width:`${pct}%`}} /></div>
        <div style={S.metaMsg}>{treinosSemana >= META_TREINOS_SEMANA ? "Meta batida! Você é fera. 🏆" : `Faltam ${META_TREINOS_SEMANA - treinosSemana} pra fechar a semana.`}</div>
      </div>
      <div style={S.grid2}>
        <button onClick={irTreino} style={{...S.bigBtn, background:"linear-gradient(135deg,#FF5E3A,#FF2D55)"}}>
          <div style={S.bigIc}>💪</div><div style={S.bigTit}>Treino de hoje</div><div style={S.bigSub}>{treino.nome}</div>
          {dia.treinoFeito && <div style={S.checkTag}>✓ Feito</div>}
        </button>
        <button onClick={irDieta} style={{...S.bigBtn, background:"linear-gradient(135deg,#11998e,#38ef7d)"}}>
          <div style={S.bigIc}>🍱</div><div style={S.bigTit}>Dieta de hoje</div><div style={S.bigSub}>{refFeitas}/{REFEICOES.length} refeições</div>
        </button>
      </div>
      <div style={S.infoRow}>
        <Info n={MACROS.kcal} l="kcal/dia" /><Info n={MACROS.prot+"g"} l="proteína" /><Info n={streak} l="sequência" />
      </div>
    </div>
  );
}
const Info = ({ n, l }) => <div style={S.infoBox}><div style={S.infoN}>{n}</div><div style={S.infoL}>{l}</div></div>;

function Treino({ treino, dia, setDia }) {
  if (treino.tipo === "descanso")
    return <div className="fade" style={S.centerBox}><div style={{fontSize:56}}>😴</div><h2 style={S.h2}>Dia de descanso</h2><p style={S.p}>Descanso também é treino. É agora que o corpo constrói. Aproveita, hidrata e volta com tudo amanhã.</p></div>;
  const setEx = (i, campo, valor) => { const exs = {...(dia.exercicios||{})}; exs[i]={...(exs[i]||{}),[campo]:valor}; setDia({exercicios:exs}); };
  const toggleSerie = (i, s) => { const exs={...(dia.exercicios||{})}; const f=new Set((exs[i]?.series)||[]); f.has(s)?f.delete(s):f.add(s); exs[i]={...(exs[i]||{}),series:[...f]}; setDia({exercicios:exs}); };
  const totalSeries = treino.ex.reduce((a,e)=>a+e.s,0);
  const feitas = treino.ex.reduce((a,e,i)=>a+((dia.exercicios?.[i]?.series)||[]).length,0);
  const done = totalSeries>0 && feitas>=totalSeries;
  return (
    <div className="fade">
      <div style={S.treinoHead}>
        <div><div style={S.eyebrow}>{treino.tipo==="cardio"?"CARDIO":"MUSCULAÇÃO"}</div><h2 style={S.h2}>{treino.nome}</h2></div>
        <div style={S.progRing}>{Math.round((feitas/totalSeries)*100)||0}%</div>
      </div>
      {treino.ex.map((e,i)=>(
        <div key={i} style={S.exCard}>
          <div style={S.exTop}><div style={S.exNome}>{e.n}</div><div style={S.exRep}>{e.r}</div></div>
          {treino.tipo==="força" && (
            <div style={S.serieRow}>
              {Array.from({length:e.s}).map((_,s)=>{
                const on=((dia.exercicios?.[i]?.series)||[]).includes(s);
                return <button key={s} onClick={()=>toggleSerie(i,s)} style={{...S.serieBtn,...(on?S.serieOn:{})}}>{on?"✓":s+1}</button>;
              })}
              <input type="text" inputMode="decimal" placeholder="carga kg" value={dia.exercicios?.[i]?.carga||""} onChange={(ev)=>setEx(i,"carga",ev.target.value)} style={S.cargaInput} />
            </div>
          )}
        </div>
      ))}
      <button onClick={()=>setDia({treinoFeito:!dia.treinoFeito})} style={{...S.finishBtn, background: dia.treinoFeito?"linear-gradient(135deg,#11998e,#38ef7d)":done?"linear-gradient(135deg,#FF5E3A,#FF2D55)":"#2a2a3a"}}>
        {dia.treinoFeito?"✓ Treino concluído — arrasou!":"Marcar treino como feito"}
      </button>
    </div>
  );
}

function Dieta({ dia, setDia }) {
  const toggle = (id) => { const r={...(dia.refeicoes||{})}; r[id]=!r[id]; setDia({refeicoes:r}); };
  const feitas = REFEICOES.filter((r)=>dia.refeicoes?.[r.id]);
  const kcalFeitas = feitas.reduce((a,r)=>a+r.kcal,0);
  return (
    <div className="fade">
      <div style={S.dietaHead}>
        <div style={S.eyebrow}>PLANO 1.700 KCAL</div><h2 style={S.h2}>Marmitas de hoje</h2>
        <div style={S.macroRow}>
          <Macro n={MACROS.prot+"g"} l="Proteína" c="#FF5E3A" /><Macro n={MACROS.carb+"g"} l="Carbo" c="#FFB800" /><Macro n={MACROS.gord+"g"} l="Gordura" c="#38ef7d" />
        </div>
        <div style={S.kcalTrack}>{kcalFeitas} de {MACROS.kcal} kcal registradas hoje</div>
      </div>
      {REFEICOES.map((r)=>{
        const on=dia.refeicoes?.[r.id];
        return (
          <button key={r.id} onClick={()=>toggle(r.id)} style={{...S.refCard,...(on?S.refOn:{})}}>
            <div style={S.refTop}>
              <div style={{...S.refCheck,...(on?S.refCheckOn:{})}}>{on?"✓":""}</div>
              <div style={{flex:1}}><div style={S.refNome}>{r.nome}</div><div style={S.refKcal}>{r.kcal} kcal</div></div>
            </div>
            <ul style={S.refItens}>{r.itens.map((it,i)=><li key={i}>{it}</li>)}</ul>
          </button>
        );
      })}
      <div style={S.dica}>💡 Todos os pesos são do alimento <b>já pronto</b>, pesado no prato. Bebe 3L de água por dia e, se a fome apertar, 1 colher de psyllium num copo cheio de água antes das refeições.</div>
    </div>
  );
}
const Macro = ({ n, l, c }) => <div style={S.macroBox}><div style={{...S.macroN, color:c}}>{n}</div><div style={S.macroL}>{l}</div></div>;

function Progresso({ pesos, setPesos }) {
  const [input, setInput] = useState("");
  const add = () => {
    const v = parseFloat(input.replace(",", "."));
    if (!v || v<30 || v>300) return;
    const d = hoje(); const semHoje = pesos.filter((p)=>p.data!==d);
    setPesos([...semHoje,{data:d,valor:v}].sort((a,b)=>a.data.localeCompare(b.data)));
    setInput("");
  };
  const meta = 90;
  const atual = pesos.length ? pesos[pesos.length-1].valor : null;
  const inicial = pesos.length ? pesos[0].valor : null;
  const perdido = inicial && atual ? (inicial-atual).toFixed(1) : "0";
  const max = Math.max(...pesos.map((p)=>p.valor), meta+2, 112);
  const min = Math.min(...pesos.map((p)=>p.valor), meta-2);
  const range = max-min || 1;
  return (
    <div className="fade">
      <div style={S.eyebrow}>EVOLUÇÃO</div><h2 style={S.h2}>Seu progresso</h2>
      <div style={S.progStats}>
        <Info n={atual?atual+"kg":"—"} l="atual" /><Info n={"-"+perdido+"kg"} l="perdido" /><Info n={meta+"kg"} l="meta" />
      </div>
      {pesos.length>1 && (
        <div style={S.chartBox}>
          <svg viewBox="0 0 320 160" style={{width:"100%"}}>
            <line x1="0" y1={160-((meta-min)/range)*160} x2="320" y2={160-((meta-min)/range)*160} stroke="#FFE14D" strokeDasharray="4 4" strokeWidth="1.5" />
            <polyline fill="none" stroke="#FF5E3A" strokeWidth="3" strokeLinejoin="round" points={pesos.map((p,i)=>{const x=(i/(pesos.length-1))*310+5; const y=160-((p.valor-min)/range)*150-5; return `${x},${y}`;}).join(" ")} />
            {pesos.map((p,i)=>{const x=(i/(pesos.length-1))*310+5; const y=160-((p.valor-min)/range)*150-5; return <circle key={i} cx={x} cy={y} r="4" fill="#FF2D55" />;})}
          </svg>
          <div style={S.chartLbl}>Linha amarela = sua meta ({meta}kg)</div>
        </div>
      )}
      <div style={S.pesoInputRow}>
        <input type="text" inputMode="decimal" placeholder="Peso de hoje (kg)" value={input} onChange={(e)=>setInput(e.target.value)} style={S.pesoInput} />
        <button onClick={add} style={S.pesoBtn}>Registrar</button>
      </div>
      <div style={S.histTitulo}>Histórico</div>
      {pesos.slice().reverse().map((p,i)=>(
        <div key={i} style={S.histRow}><span>{new Date(p.data+"T00:00:00").toLocaleDateString("pt-BR")}</span><b>{p.valor} kg</b></div>
      ))}
      {pesos.length===0 && <div style={S.vazio}>Registre seu primeiro peso pra começar o gráfico. Pesa em jejum, 1x por semana, sempre no mesmo dia.</div>}
    </div>
  );
}

const S = {
  app: { maxWidth:460, margin:"0 auto", minHeight:"100vh", background:"radial-gradient(120% 60% at 50% 0%, #241b3a 0%, #14121f 55%, #0d0b14 100%)", color:"#fff", display:"flex", flexDirection:"column", paddingBottom:"calc(78px + env(safe-area-inset-bottom))" },
  header: { display:"flex", justifyContent:"space-between", alignItems:"center", padding:"calc(22px + env(safe-area-inset-top)) 20px 8px" },
  logo: { fontSize:26, fontWeight:900, letterSpacing:-0.5, fontStyle:"italic" },
  sub: { fontSize:13, color:"#b8b3cc", marginTop:2 },
  streakBadge: { background:"linear-gradient(135deg,#FF5E3A,#FF2D55)", borderRadius:16, padding:"8px 14px", textAlign:"center", boxShadow:"0 6px 20px rgba(255,45,85,.35)" },
  streakNum: { fontSize:24, fontWeight:900, lineHeight:1 },
  streakLbl: { fontSize:9, fontWeight:700, lineHeight:1.1, marginTop:2 },
  main: { flex:1, padding:"8px 16px 16px" },
  fraseCard: { background:"linear-gradient(135deg,#7b2ff7,#f107a3)", borderRadius:20, padding:"22px 20px 20px", position:"relative", overflow:"hidden", boxShadow:"0 10px 30px rgba(123,47,247,.35)", marginTop:8 },
  fraseAspas: { position:"absolute", top:-18, left:10, fontSize:90, opacity:0.18, fontWeight:900 },
  fraseTxt: { fontSize:18, fontWeight:700, lineHeight:1.35, position:"relative" },
  fraseFonte: { marginTop:10, fontSize:13, fontWeight:700, color:"#FFE14D" },
  metaCard: { background:"#1b1830", borderRadius:18, padding:16, marginTop:14, border:"1px solid #2c2843" },
  metaTop: { display:"flex", justifyContent:"space-between", alignItems:"baseline" },
  metaLbl: { fontSize:13, color:"#b8b3cc", fontWeight:600 },
  metaVal: { fontSize:15, fontWeight:800, color:"#FFE14D" },
  barBg: { height:12, background:"#0f0d18", borderRadius:8, marginTop:10, overflow:"hidden" },
  barFill: { height:"100%", background:"linear-gradient(90deg,#FF5E3A,#FFE14D)", borderRadius:8, transition:"width .5s ease" },
  metaMsg: { fontSize:12, color:"#9a95b3", marginTop:8 },
  grid2: { display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginTop:14 },
  bigBtn: { border:"none", borderRadius:20, padding:"20px 14px", color:"#fff", textAlign:"left", cursor:"pointer", position:"relative", boxShadow:"0 8px 24px rgba(0,0,0,.3)" },
  bigIc: { fontSize:30 },
  bigTit: { fontSize:16, fontWeight:800, marginTop:8 },
